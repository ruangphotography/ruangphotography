<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Masuk Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="cp-page" content="admin">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    </style>
    <script src="pengaturan.js"></script>
    <script src="adminAuth.js"></script>
</head>
<body class="text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="login-brand">
            <div class="hdr-icon"><i class="fa-solid fa-lock"></i></div>
            <h1>Masuk Admin</h1>
            <p>Khusus pemilik studio · kelola link galeri dan pilihan klien</p>
        </div>

        <form id="gateForm" class="p-6 space-y-4" autocomplete="off">
            <div id="gateUrlBox" class="hidden">
                <label class="block text-xs font-bold text-slate-700 mb-1.5">URL Server (Web app Apps Script)</label>
                <input type="url" id="gateUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:border-blue-600 outline-none text-sm">
                <p class="text-[11px] text-slate-500 mt-1">Cukup sekali. Salin dari Deploy &gt; Web app, berakhiran <span class="font-mono">/exec</span>.</p>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Password Admin</label>
                <input type="password" id="gatePw" autocomplete="current-password" placeholder="Password" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:border-blue-600 outline-none text-sm">
            </div>

            <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
                <input type="checkbox" id="gateRemember" class="w-4 h-4 rounded border-slate-300"> Tetap masuk di perangkat ini (30 hari)
            </label>

            <p id="gateMsg" class="text-xs text-slate-500 min-h-[1rem]"></p>

            <button type="submit" id="gateBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk
            </button>
            <button type="button" id="gateChangeUrl" class="hidden w-full text-[11px] text-slate-400 hover:text-blue-600 transition">Ganti URL server</button>
        </form>
    </div>

    <script>
        // Tema studio diambil dari server (info publik) agar halaman login tampil sesuai tema di perangkat baru juga
        (async () => { try { if (!Admin.serverUrl()) return; const r = await Admin.post({ action: 'settings' }); if (r && r.ok && r.settings && window.Theme) Theme.apply(r.settings.tema || '', true); } catch (e) {} })();
        const $ = (id) => document.getElementById(id);
        const say = (t, tone) => {
            const el = $('gateMsg'); el.textContent = t;
            el.className = 'text-xs min-h-[1rem] ' + (tone === 'bad' ? 'text-red-600 font-semibold' : tone === 'warn' ? 'text-amber-700' : 'text-slate-500');
        };
        const showUrlBox = () => { $('gateUrlBox').classList.remove('hidden'); $('gateChangeUrl').classList.add('hidden'); };

        document.addEventListener('DOMContentLoaded', () => {
            // sudah login -> langsung ke halaman tujuan
            if (Admin.getSession()) { location.replace(Admin.nextPage()); return; }

            if (!Admin.serverUrl()) showUrlBox();
            else { $('gateUrl').value = Admin.serverUrl(); $('gateChangeUrl').classList.remove('hidden'); }
            $('gateChangeUrl').onclick = showUrlBox;

            if (new URLSearchParams(location.search).get('msg') === 'expired') say('Sesi berakhir, silakan masuk lagi.', 'warn');

            $('gateForm').onsubmit = async (ev) => {
                ev.preventDefault();
                const btn = $('gateBtn');
                const urlVisible = !$('gateUrlBox').classList.contains('hidden');
                if (urlVisible && !$('gateUrl').value.trim()) return say('Isi URL server terlebih dahulu.', 'bad');
                btn.disabled = true; btn.classList.add('opacity-60'); say('Memeriksa...');
                const r = await Admin.doLogin($('gatePw').value, $('gateRemember').checked, urlVisible ? $('gateUrl').value : '');
                if (r.ok) { location.replace(Admin.nextPage()); return; }
                if (r.needUrl) showUrlBox();
                say(r.message, 'bad');
                btn.disabled = false; btn.classList.remove('opacity-60');
            };
            setTimeout(() => (Admin.serverUrl() ? $('gatePw') : $('gateUrl')).focus(), 50);
        });
    </script>
</body>
</html>
